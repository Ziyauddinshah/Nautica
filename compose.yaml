services:
  app:
    build: .
    image: nautica:local
    restart: unless-stopped
    env_file: .env
    environment:
      NAUTICA_PROXY_TOKEN: ${NAUTICA_PROXY_TOKEN:?Set a random proxy token of at least 32 characters}
      NODE_ENV: production
      HOST: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:?Configure the shared online MongoDB cluster}
      MONGODB_DB: ${MONGODB_DB:?Set the production database name}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      PUBLIC_ORIGIN: https://${NAUTICA_DOMAIN:?Set NAUTICA_DOMAIN to your real hostname}
    networks:
      - nautica
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NAUTICA_PROXY_TOKEN: ${NAUTICA_PROXY_TOKEN:?Set the shared proxy token}
      NAUTICA_DOMAIN: ${NAUTICA_DOMAIN:?Set NAUTICA_DOMAIN to your real hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - nautica
networks:
  nautica:
volumes:
  caddy-data:
  caddy-config:
